<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fc">
  <title>钉钉模拟打卡生成</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#26344a;font-synthesis:none;text-rendering:optimizeLegibility;font-optical-sizing:auto}
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{min-height:100vh;background:#f3f6fc}
    button,input,select{font:inherit}
    button{cursor:pointer}
    [hidden]{display:none!important}

    .login-screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;min-height:100vh;min-height:100svh;padding:34px;overflow:auto;background:radial-gradient(ellipse at 12% 16%,#e2ebff 0,transparent 34%),radial-gradient(ellipse at 90% 88%,#e0f0eb 0,transparent 35%),linear-gradient(135deg,#f8faff,#edf2f8)}
    .login-screen:before,.login-screen:after{position:fixed;content:"";pointer-events:none;border:1px solid #fff9;border-radius:50%}
    .login-screen:before{width:500px;height:500px;top:-290px;right:-125px}
    .login-screen:after{width:370px;height:370px;bottom:-230px;left:-120px}
    .login-layout{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(350px,420px);align-items:center;gap:clamp(36px,7vw,94px);width:min(1060px,100%);margin:auto}
    .brand{display:flex;align-items:center;gap:11px;color:#263650;font-size:18px;font-weight:700;letter-spacing:.2px}
    .brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#3977fb,#79a1ff);color:white;box-shadow:0 9px 20px #3977fb42}
    .brand-mark svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .intro-copy{margin-top:clamp(54px,10vh,98px)}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;color:#7285a4;font-size:10px;font-weight:700;letter-spacing:2px}
    .eyebrow:before{width:22px;height:1px;background:#8299bf;content:""}
    .intro-copy h1{margin:20px 0 15px;color:#273750;font-size:clamp(40px,5vw,59px);font-weight:650;letter-spacing:-2.2px;line-height:1.18}
    .intro-copy h1 span{color:#3974f5}
    .intro-copy p{max-width:410px;margin:0;color:#77849a;font-size:14px;line-height:1.9}
    .feature-list{display:flex;flex-wrap:wrap;gap:9px;margin-top:30px}
    .feature{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid #ffffffd9;border-radius:999px;background:#ffffff8c;color:#697990;font-size:11px;box-shadow:0 4px 14px #33445b0a}
    .feature svg{width:15px;height:15px;fill:none;stroke:#5482e6;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .login-card{padding:34px 35px 25px;border:1px solid #ffffffdf;border-radius:24px;background:#ffffffec;box-shadow:0 24px 70px #344a641c,0 2px 8px #344a640d;backdrop-filter:blur(18px)}
    .login-card-top{display:flex;align-items:center;justify-content:space-between}
    .login-icon{width:46px;height:46px;display:grid;place-items:center;border:1px solid #e4ebfa;border-radius:15px;background:#f3f6ff;color:#3974f5}
    .login-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .local-tag{padding:7px 10px;border:1px solid #e8edf5;border-radius:999px;color:#8995a7;font-size:9px;letter-spacing:1.1px}
    .login-card h2{margin:0 0 7px;color:#29374d;font-size:25px;font-weight:650;letter-spacing:-.4px}
    .login-subtitle{margin:0 0 25px;color:#8995a6;font-size:12px}
    .login-form{display:flex;flex-direction:column;gap:16px}
    .field{display:flex;flex-direction:column;gap:8px;color:#4c5a70;font-size:12px;font-weight:600}
    .input-wrap{height:48px;display:flex;align-items:center;gap:11px;padding:0 13px;border:1px solid #e1e7ef;border-radius:10px;background:#fbfcfe;transition:border-color .18s,box-shadow .18s,background .18s}
    .input-wrap:focus-within{border-color:#82a5ff;background:white;box-shadow:0 0 0 4px #3d76f314}
    .input-wrap>svg{width:18px;height:18px;flex:none;fill:none;stroke:#9aa7b8;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .input-wrap input{width:100%;min-width:0;height:100%;padding:0;border:0;outline:0;background:transparent;color:#27354a;font-size:14px}
    .input-wrap input::placeholder{color:#b3bdca}
    .password-toggle{flex:none;padding:4px 0 4px 7px;border:0;background:transparent;color:#8190a4;font-size:11px}
    .password-toggle:hover{color:#3974f5}
    .submit-button{height:48px;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:3px;border:0;border-radius:10px;background:linear-gradient(105deg,#3474fa,#5d8aff);color:white;font-size:13px;font-weight:650;letter-spacing:.2px;box-shadow:0 8px 18px #3974f536;transition:transform .18s,box-shadow .18s}
    .submit-button:hover{transform:translateY(-1px);box-shadow:0 11px 22px #3974f542}
    .submit-button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .login-message{min-height:24px;margin:-4px 0 0;color:#d45b68;font-size:16px;line-height:1.5;text-align:left}
    .login-message.error{color:#d45b68}
    .login-footer{display:flex;justify-content:space-between;gap:8px;margin-top:19px;padding-top:16px;border-top:1px solid #edf0f5;color:#a0aabc;font-size:9px;letter-spacing:.7px}

    .workspace{min-height:100vh;display:flex;flex-direction:column;background:#f2f5f9}
    .app-header{position:sticky;top:0;z-index:5;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:22px;padding:0 clamp(18px,4vw,54px);border-bottom:1px solid #e8edf3;background:#ffffffed;box-shadow:0 3px 16px #25364d08;backdrop-filter:blur(16px)}
    .header-brand{display:flex;align-items:center;gap:10px;min-width:205px}
    .header-brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#3977fb,#79a1ff);color:white}
    .header-brand-mark svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .header-brand strong{display:block;color:#2b3950;font-size:15px;letter-spacing:.2px}
    .header-brand small{display:block;margin-top:3px;color:#9aa5b4;font-size:9px;letter-spacing:1px}
    .template-switch{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid #e9edf3;border-radius:13px;background:#f6f8fb}
    .template-tab{min-width:142px;display:flex;align-items:center;gap:9px;padding:7px 12px;border:0;border-radius:10px;background:transparent;color:#7f8ba0;text-align:left;transition:background .18s,color .18s,box-shadow .18s}
    .template-tab:hover{color:#426cb7}
    .template-tab[aria-selected="true"]{background:linear-gradient(110deg,#3474fa,#5d8aff);color:#fff;box-shadow:0 4px 14px #3974f55c}
    .tab-number{width:25px;height:25px;display:grid;place-items:center;border:1px solid #e7ebf2;border-radius:8px;color:#8290a5;font-size:9px;font-weight:700}
    .template-tab[aria-selected="true"] .tab-number{border-color:#ffffff55;background:#ffffff24;color:#fff}
    .tab-copy{display:flex;flex-direction:column;gap:2px}
    .tab-copy strong{font-size:15px;font-weight:700;white-space:nowrap}
    .tab-copy small{color:#9aa5b4;font-size:9px}
    .logout-top-button{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid #e5eaf1;border-radius:12px;background:white;color:#56647a;font-size:12px;font-weight:600;transition:background .18s,border-color .18s,color .18s}
    .logout-top-button:hover{border-color:#ced9ee;background:#f6f9ff;color:#3269e7}
    .logout-top-button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .template-stage{position:relative;flex:1;height:calc(100vh - 72px);min-height:680px;background:#eef1f5}
    .template-frame{position:absolute;inset:0;display:block;width:100%;height:100%;min-height:0;border:0;background:#eef0f3}.template-frame.is-inactive{visibility:hidden;pointer-events:none;z-index:0}.template-frame:not(.is-inactive){visibility:visible;pointer-events:auto;z-index:1}

    @media(max-width:820px){.login-screen{padding:25px 18px}.login-layout{width:min(460px,100%);grid-template-columns:1fr;gap:24px}.intro-copy{margin-top:32px;text-align:center}.eyebrow{justify-content:center}.intro-copy h1{margin:13px 0 9px;font-size:40px}.intro-copy p{margin:0 auto;font-size:12px}.feature-list{display:none}.login-card{padding:27px 27px 21px}.login-card h2{margin-top:0}.app-header{gap:12px;padding:0 14px}.header-brand{min-width:0}.header-brand small{display:none}.template-tab{min-width:auto;padding:7px 9px}}
    @media(max-width:560px){.login-screen{padding:20px 15px}.login-layout{gap:20px}.intro-copy{margin-top:22px}.intro-copy h1{font-size:34px}.login-card{padding:23px 20px 19px;border-radius:20px}.app-header{min-height:66px;flex-wrap:wrap;justify-content:space-between;padding:10px 12px}.header-brand strong{font-size:13px}.template-switch{order:3;width:100%;justify-content:center}.template-tab{flex:1;justify-content:center}.user-trigger{min-height:38px}.template-stage{height:calc(100vh - 116px);min-height:620px}.template-frame{height:100%;min-height:0}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <section id="login-screen" class="login-screen" aria-labelledby="login-heading">
    <div class="login-layout">
      <div class="login-intro">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12.5 9.2 18 20 6.5"/><path d="M12 3.5 20 6v5.5c0 4.1-2.6 7.4-8 9-5.4-1.6-8-4.9-8-9V6z" opacity=".55"/></svg></span>
          <span>钉钉模拟打卡生成</span>
        </div>
        <div class="intro-copy">
          <span class="eyebrow">ATTENDANCE STUDIO</span>
          <h1 id="login-heading">选择你的打卡风格，<br><span>从容开始。</span></h1>
          
        </div>
        <div class="feature-list" aria-hidden="true">
          <span class="feature"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 3v4m8-4v4M4 10h16"/></svg>独立模板</span>
          <span class="feature"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>自动保存</span>
          <span class="feature"><svg viewBox="0 0 24 24"><path d="M5 3h14v18l-7-4-7 4z"/><path d="m9 11 2 2 4-4"/></svg>一键导出</span>
        </div>
      </div>
      <div class="login-card"><h2>欢迎回来</h2>
        <p class="login-subtitle">输入账号信息，进入打卡工作台</p>
        <form id="login-form" class="login-form" autocomplete="on" novalidate>
          <label class="field" for="login-username">账号
            <span class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><input id="login-username" name="username" type="text" placeholder="请输入账号" autocomplete="username" autocapitalize="none" spellcheck="false"></span>
          </label>
          <label class="field" for="login-password">密码
            <span class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="login-password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password"><button id="toggle-password" class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false">显示</button></span>
          </label>
          <p id="login-message" class="login-message" aria-live="polite">请输入账号和密码继续</p>
          <button class="submit-button" type="submit"><span>登录并进入</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
        </form>
        <div class="after-sales"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l2 5-2 1.5a15 15 0 0 0 5.5 5.5L15 14l5 2v3c0 1.1-.9 2-2 2C10 21 3 14 3 6c0-1.1.9-2 2-2Z"/></svg><span>售后联系：</span><a href="tel:18781268678">18781268678</a></div>
      </div>
    </div>
  </section>

  <main id="workspace" class="workspace" hidden>
    <header class="app-header">
      <div class="header-brand">
        <span class="header-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12.5 9.2 18 20 6.5"/><path d="M12 3.5 20 6v5.5c0 4.1-2.6 7.4-8 9-5.4-1.6-8-4.9-8-9V6z" opacity=".55"/></svg></span>
        <span><strong>钉钉模拟打卡生成</strong><small>TEMPLATE SELECTOR</small></span>
      </div>
      <nav class="template-switch" aria-label="切换打卡模板">
        <button class="template-tab" type="button" data-template="hy" aria-selected="false"><span class="tab-number">01</span><span class="tab-copy"><strong>HY 模板</strong></span></button>
        <button class="template-tab" type="button" data-template="kz" aria-selected="false"><span class="tab-number">02</span><span class="tab-copy"><strong>KZ 模板</strong></span></button>
      </nav>
      <button id="logout" class="logout-top-button" type="button" aria-label="退出登录">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>退出登录</span>
      </button>
    </header>
    <section class="template-stage" aria-label="打卡模板预览">
      <iframe id="template-frame-hy" class="template-frame is-inactive" title="HY 打卡模板" src="about:blank"></iframe>
      <iframe id="template-frame-kz" class="template-frame is-inactive" title="KZ 打卡模板" src="about:blank"></iframe>
    </section>
  </main>



  <script>
  (() => {
    'use strict';
    const ACCOUNTS_KEY='attendance-shell-accounts-v1';
    const SESSION_KEY='attendance-shell-session-v1';
    const TEMPLATE_KEY='attendance-shell-template-v1';
    const SESSION_MS=2*24*60*60*1000;
    const PRESET_PASSWORD='admin1';
    const TEMPLATES={hy:{src:'./hy-钉钉打卡.html',title:'HY 打卡模板'},kz:{src:'./kz-钉钉打卡.html',title:'KZ 打卡模板'}};
    const loginScreen=document.getElementById('login-screen');
    const workspace=document.getElementById('workspace');
    const loginForm=document.getElementById('login-form');
    const usernameInput=document.getElementById('login-username');
    const passwordInput=document.getElementById('login-password');
    const loginMessage=document.getElementById('login-message');
    const togglePassword=document.getElementById('toggle-password');
    const templateFrames={hy:document.getElementById('template-frame-hy'),kz:document.getElementById('template-frame-kz')};
    const templateTabs=[...document.querySelectorAll('.template-tab')];
    const logoutButton=document.getElementById('logout');
    let credentialMismatch=hasStoredPasswordMismatch();
    let currentSession=null;
    let expiryTimer=0;
    let currentTemplate='hy';
    let templateLoadGeneration=0;

    function hasStoredPasswordMismatch(){
      let raw=null;
      try{raw=localStorage.getItem(ACCOUNTS_KEY)}catch(_){return false}
      if(raw===null)return false;
      try{
        const saved=JSON.parse(raw);
        return !saved||typeof saved!=='object'||Array.isArray(saved)||saved.admin!==PRESET_PASSWORD;
      }catch(_){return true}
    }
    function ensureCredentialConsistency(){
      if(hasStoredPasswordMismatch())credentialMismatch=true;
      if(!credentialMismatch)return true;
      try{localStorage.removeItem(SESSION_KEY)}catch(_){}
      requireLogin('请重新登录');
      setLoginMessage('请重新登录。',true);
      return false;
    }
    function setLoginMessage(text,error){loginMessage.textContent=text;loginMessage.classList.toggle('error',Boolean(error))}
    function readSession(){
      if(credentialMismatch){try{localStorage.removeItem(SESSION_KEY)}catch(_){};return null}
      try{
        const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
        if(saved&&saved.username==='admin'&&Number.isFinite(saved.expiresAt)&&saved.expiresAt>Date.now())return saved;
        if(saved)localStorage.removeItem(SESSION_KEY);
      }catch(_){}
      return null;
    }
    function selectTemplate(name){
      if(!Object.prototype.hasOwnProperty.call(TEMPLATES,name))name='hy';
      currentTemplate=name;
      Object.entries(TEMPLATES).forEach(([key,template])=>{
        const frame=templateFrames[key];
        frame.title=template.title;
        frame.setAttribute('aria-hidden',String(key!==name));
        if(frame.dataset.loaded!=='true'){
          frame.classList.add('is-inactive');
          frame.dataset.loaded='true';
          const generation=templateLoadGeneration;
          frame.addEventListener('load',()=>{
            if(generation!==templateLoadGeneration)return;
            frame.dataset.ready='true';
            if(currentTemplate===key)frame.classList.remove('is-inactive');
          },{once:true});
          frame.src=template.src;
        }
        frame.classList.toggle('is-inactive',key!==name||frame.dataset.ready!=='true');
      });
      templateTabs.forEach(tab=>tab.setAttribute('aria-selected',String(tab.dataset.template===name)));
      try{localStorage.setItem(TEMPLATE_KEY,name)}catch(_){}
    }
    function activateSession(session){
      if(!session||session.username!=='admin'||session.expiresAt<=Date.now()){requireLogin('登录已过期，请重新登录。');return}
      currentSession=session;
      loginScreen.hidden=true;
      workspace.hidden=false;
      let template='hy';
      try{template=localStorage.getItem(TEMPLATE_KEY)||'hy'}catch(_){}
      selectTemplate(template);
      window.clearTimeout(expiryTimer);
      expiryTimer=window.setTimeout(checkSession,session.expiresAt-Date.now());
    }
    function unloadTemplates(){
      templateLoadGeneration+=1;
      Object.values(templateFrames).forEach(frame=>{
        frame.classList.add('is-inactive');
        frame.src='about:blank';
        delete frame.dataset.loaded;
        delete frame.dataset.ready;
      });
    }
    function requireLogin(message){
      window.clearTimeout(expiryTimer);expiryTimer=0;currentSession=null;
      workspace.hidden=true;loginScreen.hidden=false;unloadTemplates();
      loginForm.reset();passwordInput.type='password';togglePassword.textContent='显示';
      togglePassword.setAttribute('aria-label','显示密码');togglePassword.setAttribute('aria-pressed','false');
      if(message)setLoginMessage(message,false);
    }
    function checkSession(){
      if(!ensureCredentialConsistency())return;
      if(!currentSession)return;
      const saved=readSession();
      if(!saved){requireLogin('登录已过期或已退出，请重新登录。');return}
      if(saved.expiresAt!==currentSession.expiresAt)activateSession(saved);
    }

    togglePassword.addEventListener('click',()=>{
      const showing=passwordInput.type==='password';passwordInput.type=showing?'text':'password';
      togglePassword.textContent=showing?'隐藏':'显示';togglePassword.setAttribute('aria-label',showing?'隐藏密码':'显示密码');
      togglePassword.setAttribute('aria-pressed',String(showing));passwordInput.focus();
    });
    loginForm.addEventListener('input',()=>setLoginMessage('请输入账号和密码继续',false));
    loginForm.addEventListener('submit',event=>{
      event.preventDefault();
      const username=usernameInput.value.trim();
      if(!username){setLoginMessage('请输入账号。',true);usernameInput.focus();return}
      if(!passwordInput.value){setLoginMessage('请输入密码。',true);passwordInput.focus();return}
      if(username!=='admin'||passwordInput.value!==PRESET_PASSWORD){
        setLoginMessage('账号或密码不正确，请检查后重试。',true);passwordInput.value='';passwordInput.focus();return;
      }
      const session={username:'admin',expiresAt:Date.now()+SESSION_MS};
      try{
        localStorage.setItem(ACCOUNTS_KEY,JSON.stringify({admin:PRESET_PASSWORD}));
        credentialMismatch=false;
        localStorage.setItem(SESSION_KEY,JSON.stringify(session));
      }catch(_){setLoginMessage('浏览器本地存储不可用，无法保存登录状态。',true);return}
      activateSession(session);
    });

    templateTabs.forEach(tab=>tab.addEventListener('click',()=>{
      if(!currentSession)return;
      if(!ensureCredentialConsistency())return;
      selectTemplate(tab.dataset.template);
    }));
    logoutButton.addEventListener('click',()=>{
      try{localStorage.removeItem(SESSION_KEY)}catch(_){}
      requireLogin('已退出登录，请重新登录。');usernameInput.focus();
    });
    window.addEventListener('storage',event=>{
      if(event.key===ACCOUNTS_KEY&&!ensureCredentialConsistency())return;
      if(event.key===SESSION_KEY&&currentSession){const saved=readSession();if(saved)activateSession(saved);else requireLogin('登录状态已结束，请重新登录。')}
    });
    window.addEventListener('focus',checkSession);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkSession()});
    let expiredAtLoad=false;
    try{const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');expiredAtLoad=Boolean(saved&&Number.isFinite(saved.expiresAt)&&saved.expiresAt<=Date.now())}catch(_){}
    const savedSession=readSession();
    if(savedSession)activateSession(savedSession);
    else if(credentialMismatch)setLoginMessage('本地保存的密码与预设密码不一致，请使用 admin 重新登录。',true);
    else if(expiredAtLoad)setLoginMessage('登录已过期，请重新登录。',false);
  })();
</script>
</body>
</html>
